# Render deployment configuration

services:
  # Backend API
  - type: web
    name: quickpoll-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: postgresql+asyncpg://vickypoll:Iit7065@vickykumar.postgres.database.azure.com:5432/postgres?ssl=require
      - key: GEMINI_API_KEY
        value: AIzaSyDLvgK7RnT6do4sdgJ8-fqcBPxpBxJSqyc
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://quickpoll-frontend.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 60

  # Frontend (Nginx Docker)
  - type: web
    name: quickpoll-frontend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: PORT
        value: 80

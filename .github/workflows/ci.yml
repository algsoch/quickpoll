name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: quickpoll_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: quickpoll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Create database tables
      env:
        DATABASE_URL: postgresql+asyncpg://quickpoll_test:test_password@localhost:5432/quickpoll_test
        SECRET_KEY: this-is-a-test-secret-key-with-more-than-32-characters-for-ci
        GEMINI_API_KEY: test-gemini-key-for-ci-pipeline
        ADMIN_PASSWORD: TestAdmin123!
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        ENVIRONMENT: test
        ALLOWED_ORIGINS: http://localhost:8000
        RATE_LIMIT_PER_MINUTE: 60
      run: |
        # Create tables directly from models instead of running migrations
        python -c "
        import asyncio
        from backend.database import engine, Base
        from backend import models  # Import models to register them
        
        async def create_tables():
            async with engine.begin() as conn:
                await conn.run_sync(Base.metadata.create_all)
        
        asyncio.run(create_tables())
        print('✅ Database tables created successfully')
        "

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://quickpoll_test:test_password@localhost:5432/quickpoll_test
        SECRET_KEY: this-is-a-test-secret-key-with-more-than-32-characters-for-ci
        GEMINI_API_KEY: test-gemini-key
        ADMIN_PASSWORD: TestAdmin123!
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        ENVIRONMENT: test
        ALLOWED_ORIGINS: http://localhost:8000
        RATE_LIMIT_PER_MINUTE: 60
      run: |
        pytest tests/ -v --cov=backend --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build --target production -t quickpoll:${{ github.sha }} .
        docker tag quickpoll:${{ github.sha }} quickpoll:latest

    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8080:8080 \
          -e DATABASE_URL="postgresql+asyncpg://test:test@localhost:5432/test" \
          -e SECRET_KEY="test-secret-key-minimum-32-characters" \
          -e GEMINI_API_KEY="test-key" \
          -e ENVIRONMENT="test" \
          quickpoll:latest
        
        # Wait for container to be ready
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:8080/health || exit 1
        
        # Cleanup
        docker stop test-container
        docker rm test-container

    - name: Log in to Docker Hub (on main branch)
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push to Docker Hub (on main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag quickpoll:latest ${{ secrets.DOCKER_USERNAME }}/quickpoll:latest
        docker tag quickpoll:latest ${{ secrets.DOCKER_USERNAME }}/quickpoll:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/quickpoll:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/quickpoll:${{ github.sha }}

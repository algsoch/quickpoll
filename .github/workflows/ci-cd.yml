name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy bandit
    
    - name: Run Black
      run: black --check backend/ tests/
    
    - name: Run Flake8
      run: flake8 backend/ tests/ --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Run Bandit (Security)
      run: bandit -r backend/ -ll

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install aiosqlite
    
    - name: Run tests with coverage
      env:
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        SECRET_KEY: test-secret-key-for-ci-cd-pipeline-minimum-32-chars
        ADMIN_PASSWORD: TestAdmin123!
        GEMINI_API_KEY: test-gemini-api-key-for-ci-cd
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        ENVIRONMENT: testing
        ALLOWED_ORIGINS: http://localhost:8000
        RATE_LIMIT_PER_MINUTE: 60
      run: |
        pytest --cov=backend --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: production
        push: false
        tags: quickpoll:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Build and push to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Build and push image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/quickpoll:${{ github.sha }} \
                     -t ${{ secrets.ACR_LOGIN_SERVER }}/quickpoll:latest \
                     --target production .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/quickpoll:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/quickpoll:latest
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_APP_NAME }}
        images: ${{ secrets.ACR_LOGIN_SERVER }}/quickpoll:${{ github.sha }}
    
    - name: Health Check
      run: |
        sleep 30
        curl -f ${{ secrets.AZURE_APP_URL }}/health || exit 1

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Trigger Render Deploy
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
    
    - name: Wait for deployment
      run: sleep 60
    
    - name: Health Check
      run: |
        curl -f ${{ secrets.RENDER_APP_URL }}/health || exit 1

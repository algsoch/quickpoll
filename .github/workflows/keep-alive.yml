name: Keep Render Services Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend API (New Account)
        run: |
          echo "Pinging backend (3lqv)..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://quickpoll-api-3lqv.onrender.com/health)
          echo "Backend response: $response"
          if [ $response -eq 200 ]; then
            echo "✅ Backend is alive!"
          else
            echo "⚠️ Backend returned: $response"
          fi
      
      - name: Ping Frontend (New Account)
        run: |
          echo "Pinging frontend (7nyx)..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://quickpoll-frontend-7nyx.onrender.com/)
          echo "Frontend response: $response"
          if [ $response -eq 200 ]; then
            echo "✅ Frontend is alive!"
          else
            echo "⚠️ Frontend returned: $response"
          fi
      
      - name: Report Status
        run: |
          echo "================================================"
          echo "Keep-Alive Ping Completed at $(date)"
          echo "Services pinged:"
          echo "  - Backend: https://quickpoll-api-3lqv.onrender.com"
          echo "  - Frontend: https://quickpoll-frontend-7nyx.onrender.com"
          echo "================================================"
